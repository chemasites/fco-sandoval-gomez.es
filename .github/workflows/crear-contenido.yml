name: Crear Contenido desde Issue

on:
  issues:
    types: [opened, edited]

# ============================================================================
# CONFIGURACIÓN
# ============================================================================
env:
  # Usuarios autorizados para crear contenido (separados por coma)
  AUTHORIZED_USERS: "Chemaclass,fsangom"


permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: content-writer
  queue: max
  cancel-in-progress: false

jobs:
  create-content:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
      content_path: ${{ steps.create.outputs.content_path }}
    # An edit that only changes the issue title leaves the form untouched.
    if: >-
      (github.event.action != 'edited' || github.event.changes.body)
      && (contains(github.event.issue.labels.*.name, 'nuevo-articulo')
      || contains(github.event.issue.labels.*.name, 'nueva-investigacion')
      || contains(github.event.issue.labels.*.name, 'nuevo-trabajo')
      || contains(github.event.issue.labels.*.name, 'nueva-publicacion'))

    steps:
      - name: Check authorized user
        id: auth
        env:
          AUTHOR: ${{ github.event.issue.user.login }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          if [[ ",$AUTHORIZED_USERS," == *",$AUTHOR,"* && ",$AUTHORIZED_USERS," == *",$SENDER,"* ]]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            echo "Author $AUTHOR or sender $SENDER is not authorized"
          fi

      - name: Reject unauthorized user
        if: steps.auth.outputs.authorized == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ **No autorizado**\n\nLo siento, solo usuarios autorizados pueden crear contenido a traves de este formulario.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
            core.setFailed('User not authorized');

      - name: Checkout
        if: steps.auth.outputs.authorized == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Acknowledge the form
        if: steps.auth.outputs.authorized == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { receivedStatus } = require('./.github/scripts/publication-status.js');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: receivedStatus({ edited: context.payload.action === 'edited' }),
            });

      # Without the resizer the post still publishes, with its images left on GitHub.
      - name: Setup Node
        if: steps.auth.outputs.authorized == 'true'
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Install the image resizer
        if: steps.auth.outputs.authorized == 'true'
        continue-on-error: true
        run: npm ci --omit=dev
        working-directory: .github/scripts

      - name: Parse issue and create content
        id: create
        if: steps.auth.outputs.authorized == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { createContent, saveContent, FormError } = require('./.github/scripts/content-creator.js');
            const { localizeImages } = require('./.github/scripts/content-images.js');

            const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: context.issue.number });
            const labels = issue.labels.map(l => l.name);

            let result;
            try {
              result = saveContent(createContent(issue.body, labels, {
                defaultDate: issue.created_at.slice(0, 10),
                issueNumber: issue.number,
                published: issue.state === 'closed',
              }));
            } catch (error) {
              if (error instanceof FormError) core.setOutput('form_error', error.message);
              throw error;
            }
            result = await localizeImages(result);
            console.log(`${result.updated ? 'Updated' : 'Created'}: ${result.filename}`);

            core.setOutput('updated', result.updated);
            core.setOutput('content_path', result.filename.replace(/^content\//, '').replace(/\d{4}-\d{2}-\d{2}-/, '').replace(/\.md$/, '/'));
            core.setOutput('content_type', result.contentType);

      - name: Install Zola
        if: steps.auth.outputs.authorized == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.6

      - name: Validate generated site before saving
        if: steps.auth.outputs.authorized == 'true'
        run: zola build

      - name: Commit and push
        id: commit
        if: steps.auth.outputs.authorized == 'true'
        env:
          VERB: ${{ steps.create.outputs.updated == 'true' && 'update' || 'add new' }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/ static/images/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "feat: $VERB content from issue #${{ github.event.issue.number }}"
            git pull --rebase origin main
            git push
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report publication failure
        if: failure() && steps.auth.outputs.authorized == 'true'
        uses: actions/github-script@v7
        env:
          FORM_ERROR: ${{ steps.create.outputs.form_error }}
        with:
          script: |
            const { failureStatus } = require('./.github/scripts/publication-status.js');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: failureStatus({
                formError: process.env.FORM_ERROR,
                runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              }),
            });

  publish:
    needs: create-content
    if: needs.create-content.outputs.revision != ''
    uses: ./.github/workflows/main.yml
    with:
      revision: ${{ needs.create-content.outputs.revision }}
      content_path: ${{ needs.create-content.outputs.content_path }}
      issue_number: ${{ github.event.issue.number }}
