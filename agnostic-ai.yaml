# yaml-language-server: $schema=https://raw.githubusercontent.com/Chemaclass/agnostic-ai/v0.85.0/docs/schemas/config.schema.json
version: 1

# The release the generated files come from.
requires: "0.85.0"

sources:
  agents: .agnostic-ai/agents
  skills: .agnostic-ai/skills
